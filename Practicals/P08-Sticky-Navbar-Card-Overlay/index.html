<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Navigation and Card Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="#" class="brand">Studio</a>
    <nav aria-label="Main navigation"><a href="#intro">Intro</a><a href="#cards">Cards</a><a href="#footer">Footer</a></nav>
  </header>
  <main>
    <section id="intro" class="intro">
      <h1>CSS Positioning</h1>
      <p>Scroll down to see the sticky navigation bar remain at the top.</p>
    </section>
    <section id="cards" class="cards">
      <article class="card">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=900" alt="Laptop on a desk">
        <div class="overlay"><h2>Web Design</h2><p>Ideas become interfaces.</p></div>
      </article>
      <article class="card">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900" alt="People collaborating around a laptop">
        <div class="overlay"><h2>Collaboration</h2><p>Good work grows together.</p></div>
      </article>
    </section>
  </main>
  <footer id="footer">Positioning practical · 2026</footer>
</body>
</html>
