<rect x="145" y="140" width="990" height="510" rx="18" fill="#fff" stroke="#dbe3ef"/><text x="205" y="205" font-family="Arial" font-size="14" font-weight="700" letter-spacing="3" fill="#2457c5">CSS DESIGN SYSTEM</text><text x="205" y="285" font-family="Georgia" font-size="44" font-weight="700" fill="#173b8a">Design tokens make styles</text><text x="205" y="337" font-family="Georgia" font-size="44" font-weight="700" fill="#173b8a">consistent</text><text x="205" y="390" font-family="Arial" font-size="21" fill="#64748b">A typography and colour system can be reused across a website.</text><text x="205" y="475" font-family="Georgia" font-size="28" fill="#1f2937">Why use tokens?</text><text x="205" y="520" font-family="Arial" font-size="17" fill="#475569">CSS custom properties store shared values in one place.</text><text x="205" y="550" font-family="Arial" font-size="17" fill="#475569">Updating a token can update every component that uses it.</text><rect x="205" y="590" width="48" height="22" rx="5" fill="#2457c5"/><rect x="265" y="590" width="48" height="22" rx="5" fill="#173b8a"/><rect x="325" y="590" width="48" height="22" rx="5" fill="#64748b"/>
<text x="640" y="770" font-family="Arial" font-size="13" text-anchor="middle" fill="#94a3b8">CSS DESIGN SYSTEM · Visual preview of the practical page</text></svg>