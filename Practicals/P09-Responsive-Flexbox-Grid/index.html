<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar and Card Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="#">Creative</a>
    <nav aria-label="Main navigation"><a href="#home">Home</a><a href="#services">Services</a><a href="#contact">Contact</a></nav>
  </header>
  <main id="home">
    <section class="intro"><h1>Ideas made visible.</h1><p>A responsive layout using Flexbox for navigation and a flexible card grid.</p></section>
    <section id="services" class="grid">
      <article class="card"><h2>Design</h2><p>Plan clear and useful interfaces.</p></article>
      <article class="card"><h2>Development</h2><p>Build accessible web experiences.</p></article>
      <article class="card"><h2>Responsive</h2><p>Adapt layouts to different screens.</p></article>
    </section>
  </main>
  <footer id="contact">Contact: hello@example.com</footer>
</body>
</html>
